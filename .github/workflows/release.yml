name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - if: runner.os == 'Windows'
        run: go test ./...
      - if: runner.os == 'Linux'
        run: shellcheck obtener-token.sh
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare update signing key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_SIGNING_KEY}" ]; then
            echo "::error::Secret UPDATE_SIGNING_KEY is empty; refusing to publish an unsigned release"
            exit 1
          fi
          umask 077
          keyfile="${RUNNER_TEMP}/update-signing-key"
          printf '%s\n' "${UPDATE_SIGNING_KEY}" | tr -d '\r' > "${keyfile}"
          chmod 600 "${keyfile}"
          # The key must be the one embedded in the binary, or updates would be rejected.
          derived="$(ssh-keygen -y -f "${keyfile}" | cut -d' ' -f1,2)"
          expected="$(cut -d' ' -f1,2 internal/selfupdate/update_key.pub)"
          if [ "${derived}" != "${expected}" ]; then
            echo "::error::UPDATE_SIGNING_KEY does not match internal/selfupdate/update_key.pub"
            exit 1
          fi
          echo "UPDATE_SIGNING_KEY_FILE=${keyfile}" >> "${GITHUB_ENV}"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.8.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release signature
        run: |
          set -euo pipefail
          printf 'aulaglobal-mcp-update %s\n' "$(cat internal/selfupdate/update_key.pub)" > "${RUNNER_TEMP}/allowed_signers"
          ssh-keygen -Y verify -f "${RUNNER_TEMP}/allowed_signers" -I aulaglobal-mcp-update -n aulaglobal-mcp-update -s dist/checksums.txt.sig < dist/checksums.txt
      - name: Remove signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/update-signing-key"
