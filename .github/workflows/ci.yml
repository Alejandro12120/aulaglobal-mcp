name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - if: runner.os == 'Windows'
        run: go test ./...
      - if: runner.os == 'Linux'
        run: |
          shellcheck -s sh install.sh
          shellcheck scripts/test-install.sh scripts/test-install/inner.sh scripts/gen-third-party-notices.sh
      # install.ps1 se sirve con "irm | iex": se comprueba con el analizador de
      # Windows PowerShell 5.1 (el que usa la mayoría de usuarios) y con PSScriptAnalyzer.
      - name: Lint install.ps1 (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/lint-install-ps1.ps1
      - name: Lint install.ps1 (PSScriptAnalyzer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/lint-install-ps1.ps1 -Analyze
