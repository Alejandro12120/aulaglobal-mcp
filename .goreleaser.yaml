version: 2
project_name: aulaglobal-mcp
builds:
  - main: ./cmd/aulaglobal-mcp
    binary: aulaglobal-mcp
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ if eq .Os "darwin" }}{{ if eq .Arch "arm64" }}apple-silicon{{ else }}intel{{ end }}{{ else }}{{ if eq .Arch "amd64" }}x64{{ else }}arm64{{ end }}{{ end }}
    files:
      - README.md
      - LICENSE
      - docs/TECNICO.md
checksum:
  name_template: checksums.txt
  # install.sh e install.ps1 también quedan en checksums.txt y, por tanto, cubiertos
  # por checksums.txt.sig (quien quiera puede verificarlos con ssh-keygen -Y verify).
  # Los instaladores no se fían de esta línea: verifican la firma con su clave embebida.
  extra_files:
    - glob: install.sh
    - glob: install.ps1
# Signs checksums.txt with the maintainer's OpenSSH ed25519 key; the binary
# verifies this signature (internal/selfupdate) before installing an update.
# ssh-keygen writes <file>.sig by itself, which is exactly `signature` below.
# Local snapshots without the key: goreleaser release --snapshot --clean --skip=sign
signs:
  - id: checksums
    artifacts: checksum
    cmd: ssh-keygen
    args:
      - -Y
      - sign
      - -f
      - "{{ .Env.UPDATE_SIGNING_KEY_FILE }}"
      - -n
      - aulaglobal-mcp-update
      - "${artifact}"
    signature: "${artifact}.sig"
changelog:
  sort: asc
release:
  draft: false
  # Se publican como activos de la versión para que
  # https://github.com/<repo>/releases/latest/download/install.sh (y .ps1) funcione.
  extra_files:
    - glob: install.sh
    - glob: install.ps1
