version: 2
project_name: aulaglobal-mcp
builds:
  - main: ./cmd/aulaglobal-mcp
    binary: aulaglobal-mcp
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ if eq .Os "darwin" }}{{ if eq .Arch "arm64" }}apple-silicon{{ else }}intel{{ end }}{{ else }}{{ if eq .Arch "amd64" }}x64{{ else }}arm64{{ end }}{{ end }}
    files:
      - README.md
      - LICENSE
      - docs/TECNICO.md
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
release:
  draft: false
